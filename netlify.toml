[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/jobs"
  to = "/.netlify/functions/jobs"
  status = 200

[[redirects]]
  from = "/api/bench-submission"
  to = "/.netlify/functions/bench-submission"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
